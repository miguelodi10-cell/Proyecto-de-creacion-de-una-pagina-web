<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola y Bienvenidos</title>

  <!-- Google Fonts: Playfair Display (elegante) y Poppins (limpia y moderna) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* Estilos generales */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #FCECEF; /* Fondo rosa pastel suave */
      font-family: 'Poppins', sans-serif;
      color: #4A3E3D;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* Tarjeta central limpia y ordenada */
    .card {
      background-color: #FFFFFF;
      max-width: 620px;
      width: 100%;
      padding: 36px 28px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(184, 115, 128, 0.08);
      border: 1px solid #F6D6DE;
    }

    /* Tipografía decorativa para el título */
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.1rem;
      font-weight: 600;
      color: #9C4156;
      margin-bottom: 12px;
      line-height: 1.25;
    }

    /* Texto simple y fácil de leer */
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #6E5B5D;
      font-weight: 300;
      margin-bottom: 24px;
    }

    /* Contenedor responsivo para el video de YouTube (16:9) */
    .video-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(156, 65, 86, 0.12);
      border: 1px solid #F7DDE3;
      background-color: #000;
    }

    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Botón decorativo sencillo */
    .boton {
      display: inline-block;
      text-decoration: none;
      background-color: #E2738A;
      color: #FFFFFF;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 9999px;
      transition: all 0.25s ease;
      border: none;
      cursor: pointer;
    }

    .boton:hover {
      background-color: #CE5D74;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(226, 115, 138, 0.3);
    }
  </style>
</head>
<body>

  <!-- Contenedor principal -->
  <main class="card">
    <h1>Descubre el Cáucaso</h1>
    <p>
      Un fascinante viaje visual por una de las regiones montañosas más misteriosas, históricas y hermosas del mundo.
    </p>

    <!-- Reproductor de YouTube integrado -->
    <div class="video-wrapper">
      <iframe 
        src="https://www.youtube.com/embed/32DzPbUEJak" 
        title="Cáucaso: El mundo del que nunca has oído hablar" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>

    <a href="https://youtu.be/32DzPbUEJak" target="_blank" rel="noopener noreferrer" class="boton">Ver en YouTube</a>
  </main>

</body>
</html>
