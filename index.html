<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola y Bienvenidos</title>

  <!-- Google Fonts: Playfair Display (elegante) y Poppins (limpia y moderna) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    /* Estilos generales */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #FCECEF; /* Fondo rosa pastel suave */
      font-family: 'Poppins', sans-serif;
      color: #4A3E3D;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    /* Tarjeta central limpia y ordenada */
    .card {
      background-color: #FFFFFF;
      max-width: 480px;
      width: 100%;
      padding: 48px 36px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(184, 115, 128, 0.08);
      border: 1px solid #F6D6DE;
    }

    /* Tipografía decorativa para el título */
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: #9C4156;
      margin-bottom: 16px;
      line-height: 1.25;
    }

    /* Texto simple y fácil de leer */
    p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #6E5B5D;
      font-weight: 300;
      margin-bottom: 28px;
    }

    /* Botón decorativo sencillo */
    .boton {
      display: inline-block;
      text-decoration: none;
      background-color: #E2738A;
      color: #FFFFFF;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 9999px;
      transition: all 0.25s ease;
      border: none;
      cursor: pointer;
    }

    .boton:hover {
      background-color: #CE5D74;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(226, 115, 138, 0.3);
    }
  </style>
</head>
<body>

  <!-- Contenedor principal -->
  <main class="card">
    <h1>Bienvenido a mi espacio</h1>
    <p>
      Este es un rincón simple y tranquilo para compartir ideas, proyectos o simplemente dar una cálida bienvenida a quienes nos visitan.
    </p>
    <a href="#contacto" class="boton">Saber más</a>
  </main>

</body>
</html>
